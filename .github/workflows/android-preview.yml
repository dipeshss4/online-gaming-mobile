name: Mobile checks and APK

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      store_code:
        description: 'Store code for a store''s own app (e.g. abc). Empty builds the platform''s app.'
        required: false
        default: ''
      app_name:
        description: 'App name shown on the phone for a store''s app (e.g. ABC Games). Empty keeps the default.'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo export --platform android --platform ios
        env:
          EXPO_PUBLIC_API_URL: https://loot777x.com

  apk:
    if: github.ref == 'refs/heads/native-app' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # A store's app is the preview build plus its store code: EXPO_PUBLIC_ values are bundled on the EAS worker, so
      # they go into the build profile rather than this runner's environment. See README "One app per store".
      - name: Tie the build to a store
        if: inputs.store_code != ''
        env:
          STORE_CODE: ${{ inputs.store_code }}
          APP_NAME: ${{ inputs.app_name }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const code = process.env.STORE_CODE.trim().toLowerCase();
          if (!/^[a-z0-9](?:[a-z0-9-]{0,30}[a-z0-9])$/.test(code)) throw new Error(`"${code}" is not a store code`);
          const eas = JSON.parse(fs.readFileSync('eas.json', 'utf8'));
          const env = eas.build.preview.env;
          env.EXPO_PUBLIC_STORE_CODE = code;
          if (process.env.APP_NAME.trim()) env.STORE_APP_NAME = process.env.APP_NAME.trim();
          fs.writeFileSync('eas.json', JSON.stringify(eas, null, 2));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Store app\nStore: ${code}\n`);
          JS
      - name: Build signed Android demo APK
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          test -n "$EXPO_TOKEN" || { echo 'EXPO_TOKEN secret is missing'; exit 1; }
          npx --yes eas-cli@24.7.0 build --platform android --profile preview --non-interactive --wait --json > build-result.json
      - name: Download successful APK
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const result = JSON.parse(fs.readFileSync('build-result.json', 'utf8'));
          const build = Array.isArray(result) ? result[0] : result;
          if (build.status !== 'FINISHED') throw new Error('EAS build did not finish successfully');
          const url = build.artifacts?.applicationArchiveUrl || build.artifacts?.buildUrl;
          if (!url || new URL(url).protocol !== 'https:') throw new Error('Missing HTTPS APK artifact');
          const response = await fetch(url);
          if (!response.ok) throw new Error('APK download failed: ' + response.status);
          fs.writeFileSync('online-gaming-demo.apk', Buffer.from(await response.arrayBuffer()));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `### Android demo APK\nBuild: ${build.id}\nDownload the APK from this run's artifacts.\nAWS testing endpoint; physical-device QA still required.\n`);
          JS
      - uses: actions/upload-artifact@v7
        with:
          name: online-gaming-${{ inputs.store_code || 'demo' }}-apk
          path: online-gaming-demo.apk
          if-no-files-found: error
          retention-days: 14
